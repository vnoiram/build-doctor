name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest ruff
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q
      - name: Build single-file distribution
        run: python scripts/build_zipapp.py dist/build-doctor.pyz
      - name: Smoke test distribution
        run: python dist/build-doctor.pyz env --static-only --format json
